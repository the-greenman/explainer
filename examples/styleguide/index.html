<!-- fixture for the scene component (com.semanticops.explainer/scene@1): a site puts its own scene markup here -->
<template data-scene="specimen"><div style="box-sizing:border-box;width:100%;height:100%;min-height:8rem;padding:6%;background:#f6f3ec;color:#23221f;font:1.1rem Georgia,serif"><h1 data-at="0.5" data-for="1" data-fx="write" style="margin:0 0 .4em;font-size:2em">Scene specimen</h1><p data-at="2" data-for="1" data-fx="rise" style="margin:0">Written in, then risen.</p></div></template>
<div id="root"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>

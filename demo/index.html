<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>explainer gallery</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { font: 16px system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .75rem 0; }
  input[type=range] { flex: 1; min-width: 10rem; }
  .spacer { height: 80vh; }
  section { padding: 1rem; border-left: 4px solid #ccc; margin: 2rem 0; }
</style>
</head>
<body>
<h1>explainer gallery</h1>
<p>Name: <input data-explainer-var="name" value="friend"></p>

<explainer-player id="main" src="manifest.json"></explainer-player>
<explainer-path for="main" mode="crumbs"></explainer-path>
<div class="bar" data-bar>
  <button data-explainer-action="play">Play</button>
  <button data-explainer-action="pause">Pause</button>
  <button data-explainer-action="back">Back</button>
  <button data-explainer-action="rate" data-explainer-value="0.5">0.5x</button>
  <button data-explainer-action="rate" data-explainer-value="1">1x</button>
  <button data-explainer-action="rate" data-explainer-value="1.5">1.5x</button>
  <button data-explainer-action="rate" data-explainer-value="2">2x</button>
  <button data-explainer-action="rate" data-explainer-value="-1">Reverse</button>
  <input type="range" min="0" max="12" step="0.01" value="0" data-explainer-action="seek" aria-label="Scrub">
</div>
<section data-explainer-seek="list">Scroll section: entering the middle of the viewport jumps the player above to the "list" marker.</section>

<div class="spacer"></div>
<h2>play="scrub"</h2>
<explainer-player play="scrub" src="short.json"></explainer-player>
<div class="spacer"></div>
<h2>play="enter"</h2>
<explainer-player play="enter" src="short.json"></explainer-player>
<div class="spacer"></div>
<script type="module" src="../src/index.ts"></script>
</body>
</html>
